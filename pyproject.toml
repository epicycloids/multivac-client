[project]
name = "multivac-client"
version = "0.4.0a1"
description = "Contributor client for independent research projects."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["mcp==2.2.0", "httpx>=0.28,<0.29", "pydantic>=2.12,<3", "typer>=0.16,<1", "pyjwt[crypto]>=2.13,<3", "uvicorn==0.52.4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1"]

[project.scripts]
multivac-client = "research_market.client_entry:main"
market-client = "research_market.client_entry:main"
multivac-plan = "research_market.plan_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
