[project]
name = "multivac-cpu-donor"
version = "0.1.0a1"
description = "Optional Linux CPU donor for the reviewed numerical profile and invitation-based Multivac pilot."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux"]
dependencies = ["httpx==0.28.1", "pydantic==2.13.5", "typer==0.27.2", "pyjwt[crypto]==2.15.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[project.scripts]
multivac-cpu = "research_market.cpu_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
